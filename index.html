<style>
html,body{margin:0;padding:0;background:#0B120E;min-height:100vh;font-family:'Onest',-apple-system,sans-serif;}
#root{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;}
.app{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:#0B120E;color:#F4F7F5;position:relative;overflow:hidden;}
:root{--accent:#5BE49B;--accent-dim:rgba(91,228,155,0.12);--accent-glow:rgba(91,228,155,0.3);--bg:#0B120E;--card:#141D17;--txt:#F4F7F5;--txt2:rgba(244,247,245,0.52);--line:rgba(255,255,255,0.07);}

.hdr-row{display:flex;align-items:flex-start;justify-content:space-between;}

.ibtn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.06);color:var(--txt);cursor:pointer;padding:0;}

.hrow2{display:flex;align-items:center;gap:10px;}
.badge{font-size:11px;font-weight:700;letter-spacing:0.03em;color:var(--accent);background:var(--accent-dim);border:1px solid rgba(91,228,155,0.2);border-radius:999px;padding:4px 10px;white-space:nowrap;cursor:pointer;}

.phase-row{display:flex;align-items:center;gap:8px;padding:0 22px;margin-top:2px;}
.phase-pill{font-size:10.5px;font-weight:700;letter-spacing:0.04em;padding:3px 9px;border-radius:999px;}
.phase-1{background:rgba(91,228,155,0.08);color:var(--accent);border:1px solid rgba(91,228,155,0.15);}

// ── DATE UTILS ──────────────────────────────────────────────────────────────

const PLAN_START=new Date(2026,8,1);
const PLAN_END  =new Date(2026,9,31);

function todayDate(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function dayOffset(d){return Math.round((d-PLAN_START)/86400000);}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function getPhase(off){return off>=34?2:1;}
function weekNum(off){return Math.floor(off/7)+1;}

const DAYS_ES=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DAYS_S =['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONS   =['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

// Build meals for a given date
function getMeals(date){
  const off=dayOffset(date);
  if(off<0||off>=TOTAL_DAYS)return null;
  const tIdx=((off%14)+14)%14;
  const phase=getPhase(off);
  const tmpl=TEMPLATES[tIdx];
  if(phase!==2)return tmpl;
  // Phase 2: carbo del almuerzo reducido (items con f2)
  return tmpl.map(meal=>{
    if(!meal.items.some(it=>it.f2))return meal;
    let diff=0;
    const items=meal.items.map(it=>{
      if(!it.f2)return it;
      diff+=it.kcal-it.f2.kcal;
      return{...it,name:it.f2.name,kcal:it.f2.kcal,prot:it.f2.prot,isF2:true};
    });
    return{...meal,kcal:meal.kcal-diff,items};
  });
}

function getLunchPreview(date){
  const off=dayOffset(date);
  if(off<0||off>=TOTAL_DAYS)return "Fuera del plan";
  const tIdx=((off%14)+14)%14;
  const alm=TEMPLATES[tIdx][2];
  const prot=alm.items[0].name;
  const carb=alm.items[1].name;
  return`${prot} · ${carb}`;
}

// ── STATE ────────────────────────────────────────────────────────────────────
const LS="cut_v1";
function loadLS(){
  try{
    const r=localStorage.getItem(LS);
    if(r)return JSON.parse(r);
    // migrar historial de peso del plan slowgain anterior
    const old=localStorage.getItem("sg_v1");
    if(old){const p=JSON.parse(old);if(p&&p.weights)return{weights:p.weights};}
  }catch(e){}
  return{};
}
function saveLS(s){try{localStorage.setItem(LS,JSON.stringify(s));}catch(e){}}

  return<span className="dot" style={{width:size,height:size,background:colors[state]||colors.none,boxShadow:shadow}}/>;
}

// ── REPLACE SHEET ────────────────────────────────────────────────────────────
function ReplaceSheet({meal,item,currentName,onUse,onClose}){
  const[sel,setSel]=useState(null);
  const opts=[{name:item.name,kcal:item.kcal,prot:item.prot,original:true},...(item.alts||[])].filter(o=>o.name!==currentName);
  return(
    <div className="backdrop" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="grab"/>
        <div className="shead">
          <h3 className="stitle">Reemplazar ingrediente</h3>
          <button className="sclose" onClick={onClose}>✕</button>
        </div>
        <p className="ssub"><span className="scurrent">{currentName}</span> · {meal.name} · equivalentes</p>
        <div className="altlist">
          {opts.map(alt=>(
            <button key={alt.name} className={"alt"+(sel===alt.name?" sel":"")} onClick={()=>setSel(alt.name)}>
              <span className="alt-radio"/>
              <span className="alt-name">{alt.name}{alt.original?<span className="alt-orig"> · original</span>:null}</span>
              <span className="alt-macros">{alt.kcal} kcal · {alt.prot}g prot</span>

// ── WEIGHT CHART ─────────────────────────────────────────────────────────────
function WeightChart({weights}){
  if(weights.length<2)return<div style={{textAlign:"center",color:"var(--txt2)",fontSize:13,padding:"24px 0"}}>Registra al menos 2 pesajes para ver la gráfica</div>;
  const W=280,H=84,PX=10,PY=10;
  const kgs=weights.map(w=>w.kg);
  const min=Math.min(...kgs)-0.3,max=Math.max(...kgs)+0.3;
  const range=max-min||1;
  const pts=weights.map((w,i)=>({
    x:PX+(i/Math.max(weights.length-1,1))*(W-PX*2),
    y:PY+(1-(w.kg-min)/range)*(H-PY*2)
  }));
  const path=pts.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  return(
    <div className="chart-wrap">
      <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height:H,display:"block"}} preserveAspectRatio="none">
        <path d={path} fill="none" stroke="var(--accent)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        {pts.slice(0,-1).map((p,i)=><circle key={i} cx={p.x} cy={p.y} r="2.5" fill="#0B120E" stroke="rgba(255,255,255,0.35)" strokeWidth="1.5"/>)}
        <circle cx={last.x} cy={last.y} r="3.5" fill="var(--accent)"/>
      </svg>
      <div className="chart-axis">
        <span>{weights[0].date}</span>
        <span>{weights[weights.length-1].date}</span>
      </div>
    </div>
  );
}

// ── WEIGHT SHEET ─────────────────────────────────────────────────────────────
function weightStatus(ws){
  if(ws.length<2)return{msg:"Registra tu peso cada lunes",tone:"neutral"};
  const last=ws[ws.length-1].kg;
  const prev=ws[ws.length-2].kg;
  const d=last-prev; // cut = losing
  if(d<=-0.3&&d>=-0.8)return{msg:"Perfecto — pérdida ideal",tone:"good"};
  if(d<-0.8)return{msg:"Muy rápido — sube un poco las porciones",tone:"warn"};
  if(d<0)return{msg:"Vas lento — cuida porciones y pasos",tone:"warn"};
  return{msg:"El peso no baja — ajusta esta semana",tone:"bad"};
}

function WeightSheet({weights,onAdd,onClose,dateStr}){
  const[kg,setKg]=useState("");
  const st=weightStatus(weights);
  const lastKg=weights.length?weights[weights.length-1].kg:73.5;
  const toneColor={good:"var(--accent)",warn:"#E8C158",bad:"#E06060",neutral:"var(--txt2)"}[st.tone];
  const save=()=>{
    const v=parseFloat(String(kg).replace(",","."));
    if(!isNaN(v)&&v>30&&v<250){onAdd({date:dateStr,kg:v});setKg("");}
  };
  return(
    <div className="backdrop" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="grab"/>
        <div className="shead">
          <h3 className="stitle">Registro de peso</h3>
          <button className="sclose" onClick={onClose}>✕</button>
        </div>
        <div className="w-row">
          <div className="w-inp-wrap">
            <input className="w-inp" type="number" inputMode="decimal" step="0.1" placeholder={String(lastKg)} value={kg} onChange={e=>setKg(e.target.value)}/>
            <span className="w-unit">kg</span>
          </div>
          <span className="w-date">Hoy · {dateStr}</span>
          <button className="btn btn-sm" disabled={!kg} onClick={save}>Guardar</button>
        </div>
        <WeightChart weights={weights}/>
        <div className="wstatus" style={{color:toneColor}}>
          <Dot state={st.tone==="good"?"complete":st.tone==="neutral"?"none":"partial"} size={7}/>
          {st.msg}
        </div>
      </div>
    </div>
  );
}

// ── WEEK SCREEN ───────────────────────────────────────────────────────────────
function WeekScreen({todayStatus,todayDate,completedByDate,onBack}){
  const tOff=dayOffset(todayDate);
  const wkStart=new Date(todayDate);wkStart.setDate(wkStart.getDate()-wkStart.getDay()+1); // Monday
  const days=Array.from({length:7},(_,k)=>addDays(wkStart,k));
  const wk=weekNum(tOff);
  return(
    <div className="wkscreen">
      <header className="wkhdr">
        <button className="ibtn" onClick={onBack}><BackIcon/></button>
        <div>
          <h1 className="wktitle">Esta semana</h1>
          <span className="wksub">Semana {wk} de 9 · Sep–Oct 2026</span>
        </div>
      </header>
      <div className="wkrow">
        {days.map(d=>{
          const off=dayOffset(d);
          const isToday=off===tOff;
          const inPlan=off>=0&&off<TOTAL_DAYS;
          const dateKey=d.toISOString().slice(0,10);
          const comp=completedByDate[dateKey]||{};
          const meals=inPlan?getMeals(d):null;
          const total=meals?meals.length:0;
          const done=total?Object.values(comp).filter(Boolean).length:0;
          let st="future";
          if(!inPlan)st="out";
          else if(isToday)st=todayStatus;
          else if(off<tOff)st=done===total&&total>0?"complete":done>0?"partial":"none";
          const{day,date}=fmtShort(d);
          const preview=inPlan?getLunchPreview(d):"";
          return(
            <article key={dateKey} className={"wkcard"+(isToday?" today":"")+(!inPlan?" offplan":"")}>
              <div className="wktop"><span className="wkday">{day}</span><Dot state={st}/></div>
              <span className="wkdate">{date}</span>
              <p className="wkpreview">{preview}</p>
              <span className="wkstate">{isToday?"Hoy":off<tOff?(done===total&&total>0?"Completado":done>0?"Parcial":"Sin registrar"):"Próximo"}</span>
            </article>
          );
        })}
      </div>
      <p className="hint">Desliza para ver toda la semana</p>
    </div>
  );
}

// ── TODAY SCREEN ──────────────────────────────────────────────────────────────
function TodayScreen({date,meals,completed,onToggle,replacements,onTapIng,todayStatus,onOpenWeek,onOpenWeight,totalKcal}){
  const off=dayOffset(date);
  const phase=getPhase(off);
  const wk=weekNum(off);
  const prog=Math.round((off/TOTAL_DAYS)*100);
  const semLabel={complete:"Día completado",partial:"En progreso",none:"Sin empezar"}[todayStatus];
  return(
    <>
      <header className="hdr">
        <div className="hdr-row">
          <h1 className="hdate">{fmtFull(date)}</h1>
          <div className="hicons">
            <button className="ibtn" onClick={onOpenWeek} title="Vista semanal"><CalIcon/></button>
            <button className="ibtn" onClick={onOpenWeight} title="Registrar peso"><ScaleIcon/></button>
          </div>
        </div>
        <div className="hrow2">
          <button className="badge" onClick={onOpenWeek}>Semana {wk} de 9</button>
          <div className="pbar"><div className="pfill" style={{width:prog+"%"}}/></div>
        </div>
      </header>
      <div className="phase-row">
        <span className={"phase-pill phase-"+phase}>FASE {phase}</span>
        <span className="phase-sub">{phase===2?"~1,950 kcal · carbo de almuerzo reducido":"~2,050 kcal"} · Día {off+1} de {TOTAL_DAYS}</span>
      </div>
      <main className="meals">
        {meals.map(meal=>{
          const done=!!completed[meal.id];
          return(
            <article key={meal.id} className={"mcard"+(done?" done":"")}>
              <button className="checkwrap" onClick={()=>onToggle(meal.id)}>
                <span className={"check"+(done?" on":"")}><CheckIcon/></span>
              </button>
              <div className="mbody">
                <h2 className="mname">{meal.name}</h2>
                <p className="mitems">
                  {meal.items.map((item,idx)=>{
                    const key=meal.id+":"+idx;
                    const cur=replacements[key]||item.name;
                    const swapped=cur!==item.name;
                    return(
                      <span key={idx}>
                        {idx>0?<span className="sep"> · </span>:null}
                        <button className={"ing"+(swapped?" swapped":"")+(item.isF2?" bonus":"")} onClick={()=>onTapIng(meal,idx)}>{cur}</button>
                      </span>
                    );
                  })}
                </p>
              </div>
              <span className="mkcal">{meal.kcal} kcal</span>
            </article>
          );
        })}
      </main>
      <footer className="foot">
        <div className="foot-l">
          <span className="foot-lbl">Total del día</span>
          <span><span className="foot-val">{totalKcal.toLocaleString("es")}</span><span className="foot-unit">kcal</span></span>
        </div>
        <div className="sem"><Dot state={todayStatus} size={8}/>{semLabel}</div>
      </footer>
    </>
  );
}

// ── OUT OF PLAN SCREEN ────────────────────────────────────────────────────────
function OutOfPlan({date}){
  const off=dayOffset(date);
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flex:1,padding:"40px 32px",textAlign:"center",gap:12}}>
      <div style={{fontSize:40}}>🏁</div>
      {off<0
        ?<><p style={{fontSize:18,fontWeight:700,margin:0}}>El plan empieza el 1 de septiembre</p><p style={{fontSize:13,color:"var(--txt2)",margin:0}}>Vuelve en unos días</p></>
        :<><p style={{fontSize:18,fontWeight:700,margin:0}}>Plan completado</p><p style={{fontSize:13,color:"var(--txt2)",margin:0}}>¡Lograste los 61 días de cut!</p></>
      }
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){
  const[view,setView]=useState("today");
  const[state,setState]=useState(()=>loadLS());
  const td=useMemo(()=>todayDate(),[]);
  const dateKey=td.toISOString().slice(0,10);
  const dateStr=fmtShort(td).date;

  const completed=(state[dateKey]&&state[dateKey].completed)||{};
  const replacements=(state[dateKey]&&state[dateKey].replacements)||{};
  const weights=state.weights||[];
  const completedByDate=useMemo(()=>{
    const r={};
    Object.entries(state).forEach(([k,v])=>{if(k!=="weights"&&v&&v.completed)r[k]=v.completed;});
    return r;
  },[state]);

  const[replaceTarget,setReplaceTarget]=useState(null);
  const[weightOpen,setWeightOpen]=useState(false);

  const meals=useMemo(()=>getMeals(td),[td]);
  const totalKcal=meals?meals.reduce((s,m)=>s+m.kcal,0):0;

  const setDay=up=>{
    setState(s=>{
      const day=s[dateKey]||{};
      const next={...s,[dateKey]:{...day,...up}};
      saveLS(next);
      return next;
    });
  };

  const toggle=id=>setDay({completed:{...completed,[id]:!completed[id]}});

  const tapIng=(meal,idx)=>setReplaceTarget({meal,itemIdx:idx});

  const useAlt=name=>{
    const{meal,itemIdx}=replaceTarget;
    const key=meal.id+":"+itemIdx;
    const orig=meal.items[itemIdx].name;
    const next={...replacements};
    if(name===orig)delete next[key];else next[key]=name;
    setDay({replacements:next});
  };

  const addWeight=entry=>{
    setState(s=>{
      const ws=(s.weights||[]).filter(w=>w.date!==entry.date).concat(entry);
      const next={...s,weights:ws};
      saveLS(next);
      return next;
    });
  };

  const doneCount=meals?meals.filter(ml=>completed[ml.id]).length:0;
  const todayStatus=!meals?"none":doneCount===meals.length?"complete":doneCount>0?"partial":"none";

  const off=dayOffset(td);
  const inPlan=off>=0&&off<TOTAL_DAYS;

  return(
    <div className="app">
      {view==="week"?(
        <WeekScreen todayStatus={todayStatus} todayDate={td} completedByDate={completedByDate} onBack={()=>setView("today")}/>
      ):!inPlan?(
        <OutOfPlan date={td}/>
      ):(
        <TodayScreen
          date={td} meals={meals} completed={completed}
          onToggle={toggle} replacements={replacements}
          onTapIng={tapIng} todayStatus={todayStatus}
          onOpenWeek={()=>setView("week")} onOpenWeight={()=>setWeightOpen(true)}
          totalKcal={totalKcal}
        />
      )}
      {replaceTarget&&meals&&(()=>{
        const item=replaceTarget.meal.items[replaceTarget.itemIdx];
        const key=replaceTarget.meal.id+":"+replaceTarget.itemIdx;
        return<ReplaceSheet meal={replaceTarget.meal} item={item} currentName={replacements[key]||item.name} onUse={useAlt} onClose={()=>setReplaceTarget(null)}/>;
      })()}
      {weightOpen&&<WeightSheet weights={weights} onAdd={addWeight} onClose={()=>setWeightOpen(false)} dateStr={dateStr}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
